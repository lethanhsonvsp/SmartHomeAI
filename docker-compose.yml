# Chỉ hạ tầng dev: PostgreSQL + Mosquitto. Hub và AI chạy bằng systemd (xem infra/systemd).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: smarthome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthome_dev}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqttdata:/mosquitto/data
    restart: unless-stopped
volumes:
  pgdata:
  mqttdata:
