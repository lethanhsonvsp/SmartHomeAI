[project]
name = "smarthome-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "opencv-python-headless>=4.8,<5", "onnxruntime>=1.18", "paho-mqtt>=2.0", "jsonschema>=4.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
